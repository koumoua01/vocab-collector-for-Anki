<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vocab Collector</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <div>
        <h1>Vocab Collector</h1>
        <p>Capture words and send to Anki.</p>
      </div>
      <div>
        <button id="open-help" class="ghost-button" type="button" style="margin-right: 4px;">Help</button>
        <button id="open-options" class="ghost-button" type="button">Options</button>
      </div>
    </header>

    <section class="panel" style="text-align: center; padding: 20px;">
      <button id="add-vocab" class="primary" style="width: 100%; padding: 12px; font-size: 14px;">Add New Vocab</button>
    </section>

    <section class="panel">
      <div class="panel-header">
        <h2>Recent history</h2>
        <button id="clear-history" class="ghost-button" type="button">Clear</button>
      </div>
      <ul class="history" id="history"></ul>
    </section>

    <script type="module" src="popup.js"></script>
  </body>
</html>
