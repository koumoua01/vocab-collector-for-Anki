<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <filter id="shadow" x="-0.2" y="-0.2" width="1.4" height="1.4">
      <feDropShadow dx="4" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <g filter="url(#shadow)" transform="translate(0, 20)">
    <!-- Left Page -->
    <path d="M256 160 C 180 140, 100 160, 100 160 V 380 C 100 380, 180 340, 256 380 Z" fill="#e0f2fe"/>
    <!-- Right Page -->
    <path d="M256 160 C 332 140, 412 160, 412 160 V 380 C 412 380, 332 340, 256 380 Z" fill="#ffffff"/>
    <!-- Spine shading -->
    <path d="M256 160 V 380" stroke="#bae6fd" stroke-width="4"/>
    <!-- Text lines -->
    <rect x="140" y="200" width="80" height="16" rx="8" fill="#bae6fd"/>
    <rect x="140" y="240" width="60" height="16" rx="8" fill="#bae6fd"/>
    <rect x="290" y="200" width="80" height="16" rx="8" fill="#bfdbfe"/>
    <rect x="290" y="240" width="90" height="16" rx="8" fill="#bfdbfe"/>
    <rect x="290" y="280" width="50" height="16" rx="8" fill="#bfdbfe"/>
  </g>
  <!-- Accent/Bookmark -->
  <path d="M360 160 V 220 L 380 200 L 400 220 V 160 Z" fill="#facc15" transform="translate(0, 0)"/>
</svg>
